name: Radar DayTrade

on:
  schedule:
    # horários em UTC — equivalem a ~08h, 12h, 16h e 20h de Brasília (UTC-3)
    - cron: '0 11,15,19,23 * * *'
  workflow_dispatch: {}   # permite rodar manualmente na aba Actions, para testar

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Escanear mercado e notificar
        run: node robo/radar.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
